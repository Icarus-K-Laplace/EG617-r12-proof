name: EG617 r12 R23 Cost6 GATE47 verification
on:
  push:
    branches: [workstream/r12-lean-m2-r23-cost12-chat-20261111]
    paths:
      - r12_master/workstreams/r12-lean-m2-r23-cost12-chat-20261111/lean/**
      - r12_master/workstreams/r12-lean-m2-r23-cost12-chat-20261111/build-linux.sh
      - .github/workflows/eg617-r12-lean-m2-r23-20261111.yml
permissions:
  contents: read
jobs:
  m1-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: 2
    defaults:
      run:
        shell: bash
        working-directory: r12_master/workstreams/r12-lean-m2-r23-cost12-chat-20261111/lean
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install exact official Lean archive
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.35.0-linux/bin" >> "$GITHUB_PATH"
      - name: Run standalone build and complete audits
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/eg617-standalone-ascii"
          mkdir -p "$probe"
          git -C "$GITHUB_WORKSPACE" archive HEAD r12_master/workstreams/r12-lean-m2-r23-cost12-chat-20261111 | tar -xf - -C "$probe" --strip-components=3
          test ! -e "$probe/.git"
          test ! -e "$probe/lean/.lake"
          cd "$probe"
          echo "STANDALONE_ASCII_BUILD_ROOT=$PWD; NO_GIT_OR_PROJECT_CACHE"
          bash build-linux.sh
