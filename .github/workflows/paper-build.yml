name: Build EG617 r=12 manuscript

on:
  push:
    branches:
      - workstream/r12-paper-full-manuscript-20261031
    paths:
      - "PAPER/**/*.tex"
      - "PAPER/references.bib"
      - "PAPER/main.tex"
      - ".github/workflows/paper-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latex-and-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out manuscript branch
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra

      - name: Compile paper
        working-directory: PAPER
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Run integrated root verifier
        working-directory: PAPER/supplement/root
        run: |
          python3 --version
          python3 -B INDEPENDENT_VERIFIER.py

      - name: Independently rerun low-edge verifier
        run: |
          mkdir -p "$RUNNER_TEMP/low"
          cp -a PAPER/supplement/root/frozen/low/. "$RUNNER_TEMP/low/"
          cd "$RUNNER_TEMP/low"
          python3 -B INDEPENDENT_VERIFIER.py

      - name: Independently rerun 286-edge equality verifier
        run: |
          mkdir -p "$RUNNER_TEMP/eq286"
          cp -a PAPER/supplement/root/frozen/eq286/. "$RUNNER_TEMP/eq286/"
          cd "$RUNNER_TEMP/eq286"
          python3 -B INDEPENDENT_VERIFIER.py

      - name: Independently rerun q20 shell equality verifier
        run: |
          mkdir -p "$RUNNER_TEMP/q20"
          cp -a PAPER/supplement/h12/. "$RUNNER_TEMP/q20/"
          cd "$RUNNER_TEMP/q20"
          python3 -B VERIFY_Q20_EQUALITY.py

      - name: Independently rerun COVER shell verifier
        run: |
          mkdir -p "$RUNNER_TEMP/cover"
          cp -a PAPER/supplement/root/frozen/cover/. "$RUNNER_TEMP/cover/"
          cd "$RUNNER_TEMP/cover"
          python3 -B INDEPENDENT_VERIFIER.py

      - name: Archive source supplement
        run: zip -qr "$RUNNER_TEMP/eg617-r12-proof-supplement.zip" PAPER/supplement

      - name: Upload source supplement ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eg617-r12-proof-supplement
          path: ${{ runner.temp }}/eg617-r12-proof-supplement.zip
          if-no-files-found: warn

      - name: Upload manuscript and fresh replay outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eg617-r12-manuscript-and-replay
          path: |
            PAPER/main.pdf
            PAPER/main.log
            PAPER/main.blg
            PAPER/supplement/root/FRONTEND_REPLAY.json
            PAPER/supplement/root/VERIFICATION_RESULT.json
          if-no-files-found: warn
