name: EG617 r12 fixed-version kernel verification
on:
  push:
    branches: [workstream/r12-lean-m1-m2-chat-20261109]
    paths:
      - r12_master/workstreams/r12-lean-m1-m2-chat-20261109/lean/**
      - r12_master/workstreams/r12-lean-m1-m2-chat-20261109/build-linux.sh
      - .github/workflows/eg617-r12-lean-recovery-20261109.yml
permissions:
  contents: read
jobs:
  m1-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: 2
    defaults:
      run:
        shell: bash
        working-directory: r12_master/workstreams/r12-lean-m1-m2-chat-20261109/lean
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install exact official Lean archive
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.35.0-linux/bin" >> "$GITHUB_PATH"
      - name: Run standalone build and complete audits
        run: bash ../build-linux.sh
